      :root { --app-brand-accent: #d97706; --app-brand-light-bg: #f1f5f9; --app-brand-dark-bg: #262626; --boot-light-text: #161619; --boot-dark-text: #f1f5f9; --boot-light-muted: #686870; --boot-dark-muted: #94a3b8; }/* Inlined into HTML so the startup screen appears before the application bundle. */
html:has(.app-boot) {
  background: var(--app-brand-light-bg);
  color-scheme: light;
}
html:has(.app-boot) body {
  margin: 0;
}
.app-boot {
  box-sizing: border-box;
  min-height: 100svh;
  padding: max(2rem, env(safe-area-inset-top)) 1.5rem
    max(2rem, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  background: var(--app-brand-light-bg);
  color: var(--boot-light-text);
  text-align: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
.app-boot-icon {
  border-radius: 22px;
  box-shadow: 0 14px 36px
    color-mix(in srgb, var(--app-brand-accent) 12%, transparent);
}
.app-boot .app-boot-name {
  margin: 1.25rem 0 0.35rem;
  color: inherit;
  font-size: 2rem;
  font-weight: 700;
  line-height: 1.25;
  letter-spacing: -0.04em;
}
.app-boot .app-boot-tagline {
  margin: 0;
  color: var(--boot-light-muted);
  font-size: 1rem;
}
.app-boot-spinner {
  width: 22px;
  height: 22px;
  margin-top: 2rem;
  border: 2px solid color-mix(in srgb, var(--app-brand-accent) 15%, transparent);
  border-top-color: var(--app-brand-accent);
  border-radius: 50%;
  animation: app-boot-spin 0.8s linear infinite;
}
.app-boot .app-boot-message {
  margin: 0.8rem 0 0;
  color: var(--boot-light-muted);
  font-size: 0.875rem;
  line-height: 1.6;
}
.app-boot-retry {
  margin-top: 1rem;
  min-height: 44px;
  padding: 0.75rem 1.25rem;
  border: 0;
  border-radius: 9px;
  background: var(--app-brand-accent);
  color: white;
  font: inherit;
  cursor: pointer;
}
.app-boot-retry:focus-visible {
  outline: 3px solid var(--app-brand-accent);
  outline-offset: 4px;
}
.app-boot [hidden] {
  display: none;
}
html[data-app-theme="dark"]:has(.app-boot),
html[data-app-theme="dark"] .app-boot {
  background: var(--app-brand-dark-bg);
  color: var(--boot-dark-text);
  color-scheme: dark;
}
html[data-app-theme="dark"]
  .app-boot
  :is(.app-boot-tagline, .app-boot-message) {
  color: var(--boot-dark-muted);
}
@media (prefers-reduced-motion: reduce) {
  .app-boot-spinner {
    animation: none;
    border-top-color: var(--app-brand-accent);
  }
}
@keyframes app-boot-spin {
  to {
    transform: rotate(360deg);
  }
}

    <script>
      
  document.addEventListener('click', function(event) {
    if (event.target instanceof Element && event.target.closest('[data-boot-retry]')) window.location.reload();
  });
  window.addEventListener('error', function(event) {
    var boot = document.querySelector('.app-boot');
    if (!boot) return;
    var moduleFailure = event.target instanceof HTMLScriptElement && event.target.type === 'module';
    if (!moduleFailure && !(event instanceof ErrorEvent)) return;
    if (event instanceof ErrorEvent && event.filename && !event.filename.startsWith(window.location.origin)) return;
    var message = boot.querySelector('[data-boot-message]');
    if (message) message.textContent = message.getAttribute('data-boot-failure');
    var spinner = boot.querySelector('.app-boot-spinner');
    if (spinner) spinner.hidden = true;
    var retry = boot.querySelector('[data-boot-retry]');
    if (retry) retry.hidden = false;
  }, true);
;
